name: Pruebas Automatizadas - Inventario

on:
  push:
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: Verificar sintaxis
        run:
          php -l src/validaciones.php
          php -l test/test_validaciones.php
     
      - name: Ejecutar pruebas
        run: php test/test_validaciones.php